# --- Defaults ---

# --- pymarl options ---
runner: "episode" # Runs 1 env for an episode
mac: "basic_mac" # Basic controller
env: "sc2" # Environment name
common_reward: True  # Run experiment with common reward setup
reward_scalarisation: "sum"  # How to aggregate rewards to single common reward (only used if common_reward is True)
env_args: {} # Arguments for the environment
batch_size_run: 1 # Number of environments to run in parallel
test_nepisode: 20 # Number of episodes to test for
test_interval: 2000 # Test after {} timesteps have passed
test_greedy: True # Use greedy evaluation (if False, will set epsilon floor to 0
log_interval: 2000 # Log summary of stats after every {} timesteps
runner_log_interval: 2000 # Log runner stats (not test stats) every {} timesteps
learner_log_interval: 2000 # Log training stats every {} timesteps
t_max: 10000 # Stop running after this many timesteps
use_cuda: True # Use gpu by default unless it isn't available
buffer_cpu_only: True # If true we won't keep all of the replay buffer in vram

# --- Logging options ---
use_tensorboard: False # Log results to tensorboard
use_wandb: False # Log results to W&B
wandb_team: null # W&B team name
wandb_project: null # W&B project name
wandb_mode: "offline" # W&B mode (online/offline)
wandb_save_model: False # Save models to W&B (only done if use_wandb is True and save_model is True)
save_model: False # Save the models to disk
save_model_interval: 50000 # Save models after this many timesteps
checkpoint_path: "" # Load a checkpoint from this path
evaluate: False # Evaluate model for test_nepisode episodes and quit (no training)
render: False # Render the environment when evaluating (only when evaluate == True)
load_step: 0 # Load model trained on this many timesteps (0 if choose max possible)
save_replay: False # Saving the replay of the model loaded from checkpoint_path
local_results_path: "results" # Path for local results

# --- Shared exploration memory (thesis mechanism) ---
# Centralized, count-based shared memory that adds an intrinsic novelty bonus to
# the training reward, steering the team to collaboratively explore under-sampled
# states. Off by default so the exact same command reproduces the baselines; set
# use_shared_memory=True on the command line to switch the mechanism on.
# PASSIVE mode: intrinsic reward bonus (memory shapes the reward, not the policy).
use_shared_memory: False   # on/off switch for the passive reward-bonus mechanism
sm_bonus_coef: 0.05        # scale of the intrinsic reward bonus (bonus = coef/sqrt(count))
# ACTIVE mode: directed action selection (memory enters the exploration POLICY at
# decision time -- Q(s,a) += beta/sqrt(N(s,a)+1)). This is what the task requires:
# the exploration policy depends on the collectively accumulated shared knowledge and
# actively reduces redundant state-action sampling. Can be used alone or with passive.
sm_active_selection: False # on/off switch for the active directed-selection mechanism
sm_select_beta: 0.5        # scale of the action-selection novelty bonus
# How the active state-action counts are organised.
#   team      -- ONE shared table: novelty = "has anyone done this?". Cannot divide labour.
#   per_agent -- one table PER agent, all readable by all; agent i's bonus is a function of
#                how novel its candidate (obs, action) is to EVERY agent (Iqbal & Sha 2019).
sm_count_mode: "team"
# Only used when sm_count_mode=per_agent. How the per-agent novelties are combined:
#   independent     -- own table only (ablation: sharing switched off)
#   minimum         -- bonus only where NO agent has been (literal "no redundant sampling")
#   covering        -- novel to me but known to others -> agents spread out
#   burrowing       -- go deeper into my own region -> depth-first specialisation
#   leader_follower -- agent 0 burrows, the rest cover
# Which one wins is task-dependent (Iqbal & Sha), so this is a knob to sweep.
sm_combine: "minimum"
# Restricted-space counting (Liu et al. 2021, CMAE): count over a CHOSEN FEW observation
# features instead of the whole vector. Their ablation drops 47.7% -> 9.4% without it,
# i.e. WHICH features you count matters more than how finely you hash them.
# "all" = whole observation (previous behaviour). Otherwise an index spec, e.g. "4:19".
# SMAC 3m observation layout (obs_shape=30, verified from the env):
#    0:4   can-I-move north/south/east/west
#    4:19  3 enemies x (in range, distance, rel x, rel y, health)
#   19:29  2 allies  x (visible,  distance, rel x, rel y, health)
#   29:30  own health
# So "4:19" counts the enemy configuration only; "4:29" enemies+allies; "29:30" own health.
sm_obs_slice: "all"
# Linear decay of the novelty bonus's influence over training, adapted from CMAE
# (Liu et al. 2021, Alg. 1: actions come from "alpha*mu + (1-alpha)*pi" with "alpha
# decreases linearly to 0"). We have no separate exploration policy, so instead the
# bonus is multiplied by alpha = max(0, 1 - t_env / sm_beta_anneal_time).
# Rationale: the 1/sqrt(N+1) term only decays for buckets that are REVISITED. New
# obs-buckets keep appearing throughout training (measured: 2445-4654 still being
# created at 2M steps on 5m_vs_6m), so for those N stays ~0 and the bonus stays at
# the full beta forever -- perturbing an already-converged policy. This second,
# time-based decay is what removes that.
# 0 = OFF (constant beta, the previous behaviour). Set to t_max to decay across the
# whole run, or lower to stop exploring earlier.
sm_beta_anneal_time: 0
# Shared hashing settings (used by both modes).
sm_hash_dim: 16            # SimHash code length in bits (granularity knob; smaller = coarser buckets)
sm_hash_seed: 0            # seed for the fixed SimHash random projection
sm_discretization: 0.25    # fallback floor-discretization bucket width (only used if sm_hash_dim<=0)

# --- RL hyperparameters ---
gamma: 0.99
batch_size: 32 # Number of episodes to train on
buffer_size: 32 # Size of the replay buffer
lr: 0.0005 # Learning rate for agents
optim_alpha: 0.99 # RMSProp alpha
optim_eps: 0.00001 # RMSProp epsilon
grad_norm_clip: 10 # Reduce magnitude of gradients above this L2 norm
add_value_last_step: True

# --- Agent parameters ---
agent: "rnn" # Default rnn agent
hidden_dim: 64 # Size of hidden state for default rnn agent
obs_agent_id: True # Include the agent's one_hot id in the observation
obs_last_action: True # Include the agent's last action (one_hot) in the observation

# --- Experiment running params ---
repeat_id: 1
label: "default_label"
hypergroup: null